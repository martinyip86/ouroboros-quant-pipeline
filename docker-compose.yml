  syncer:
    build: .
    container_name: syncer-server
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
    command: python -m src.workers.syncer
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    depends_on:
      quant-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"


